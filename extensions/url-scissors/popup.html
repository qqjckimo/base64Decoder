<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>URL Scissors</title>
<style>
/* color-scheme first: the popup's own background must be right on the very
   first paint, otherwise dark mode shows a white flash that reads as slowness */
:root{
  color-scheme: light dark;
  --bg:#fff; --fg:#14181d; --muted:#5b6774; --line:#e3e8ee;
  --field:#f6f8fa; --accent:#00b9fe; --danger:#e5484d;
  --sp:8px; --r:8px;
  /* sizing: JS overwrites these before the first render (see popup.js) */
  --w:480px;        /* clamped to the browser window, never below --min-w */
  --maxh:600px;     /* clamped to the browser window, never below --min-h */
  --min-w:360px;
  --min-h:320px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16191d; --fg:#e8edf2; --muted:#9aa7b4;
         --line:#272c33; --field:#1e2228; }
}
*{box-sizing:border-box}
html{height:auto}
body{
  margin:0;
  /* Content drives the height; it grows until --maxh, then #rows scrolls.
     Chrome sizes the popup to the document, so clamping here is what keeps
     the popup inside the browser window instead of being clipped. */
  width:var(--w);
  min-width:var(--min-w);
  min-height:var(--min-h);
  max-height:var(--maxh);
  display:flex; flex-direction:column;
  background:var(--bg); color:var(--fg);
  font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
}
header{
  flex:0 0 auto;
  padding:calc(var(--sp)*1.5); border-bottom:1px solid var(--line);
  display:flex; flex-direction:column; gap:var(--sp);
}
.head-row{display:flex;gap:var(--sp);align-items:center;justify-content:space-between}
.brand{font-weight:600;letter-spacing:.01em}
.brand b{color:var(--accent)}
.count{color:var(--muted);font-size:11px}
#base{
  width:100%; font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;
  background:var(--field); border:1px solid var(--line); border-radius:var(--r);
  color:var(--fg); padding:6px 8px;
}
#base:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
/* the only scroll region; min-height:0 lets it actually shrink inside flex */
#rows{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
      padding:var(--sp); scrollbar-width:thin}
.row{
  contain:layout style;                /* keep layout invalidation inside the row */
  display:grid; grid-template-columns:1fr 1fr 24px;
  gap:6px; align-items:start; margin-bottom:6px;
}
.row input{
  font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;
  background:var(--field); border:1px solid var(--line); border-radius:6px;
  color:var(--fg); padding:5px 7px; min-width:0; width:100%;
  field-sizing:content;                /* engine-side autosize, no JS measuring */
  max-height:84px;
}
.row input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.row input.k{font-weight:600}
.del{
  background:none;border:0;color:var(--muted);cursor:pointer;border-radius:5px;
  padding:4px;line-height:1;transition:color .15s,background .15s;
}
.del:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.del:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.empty{color:var(--muted);text-align:center;padding:calc(var(--sp)*3) var(--sp);font-size:12px}
footer{
  flex:0 0 auto;
  padding:calc(var(--sp)*1.5); border-top:1px solid var(--line);
  display:flex; flex-direction:column; gap:var(--sp);
}
#preview{
  font:11px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;
  color:var(--muted); max-height:46px; overflow-y:auto; word-break:break-all;
}
.btns{display:flex;gap:var(--sp)}
button.primary{
  flex:1;background:var(--accent);color:#001b26;border:0;border-radius:var(--r);
  padding:8px;font-weight:600;cursor:pointer;
  transition:opacity .15s,transform .15s;    /* compositor-only properties */
}
button.primary:active{transform:translateY(1px)}
button.primary:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
button.ghost{
  background:none;border:1px solid var(--line);color:var(--fg);
  border-radius:var(--r);padding:8px 10px;cursor:pointer;
}
button.ghost:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#perf{font:10px/1.5 ui-monospace,monospace;color:var(--muted);
      border-top:1px dashed var(--line);padding-top:6px;white-space:pre}
</style>
</head>
<body>
<header>
  <div class="head-row">
    <span class="brand">URL <b>Scissors</b></span>
    <span class="count" id="count"></span>
  </div>
  <input id="base" spellcheck="false" aria-label="origin + path">
</header>

<div id="rows" role="list"></div>

<footer>
  <div id="preview"></div>
  <div class="btns">
    <button class="primary" id="apply">套用</button>
    <button class="ghost" id="add">+ 參數</button>
  </div>
  <div id="perf"></div>
</footer>

<template id="row-tpl">
  <div class="row" role="listitem">
    <input class="k" spellcheck="false" placeholder="key"   aria-label="key">
    <input class="v" spellcheck="false" placeholder="value" aria-label="value">
    <button class="del" title="刪除" aria-label="刪除">✕</button>
  </div>
</template>

<script src="popup.js"></script>
</body>
</html>
