<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>URL Scissors</title>
<style>
/* color-scheme first: the popup background must be right on the very first
   paint, otherwise dark mode flashes white and reads as slowness. */
:root{
  color-scheme: light dark;
  --bg:#fff; --fg:#14181d; --muted:#5b6774; --line:#e3e8ee; --field:#f6f8fa;
  --accent:#00b9fe; --on-accent:#00202d; --danger:#e5484d;
  --warn:#c27c0e; --warn-bg:#fff7e8; --info:#5b6774; --info-bg:#f2f4f7;
  --sp:8px; --r:8px;
  /* sizing: popup.js overwrites these before the first render */
  --w:480px; --maxh:600px; --min-w:360px; --min-h:320px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16191d; --fg:#e8edf2; --muted:#9aa7b4; --line:#2a3038; --field:#1e2228;
         --warn:#f0b44c; --warn-bg:#2a2214; --info:#9aa7b4; --info-bg:#1e2228; }
}
*{box-sizing:border-box}
html{height:auto}
body{
  margin:0; width:var(--w); min-width:var(--min-w);
  min-height:var(--min-h); max-height:var(--maxh);
  display:flex; flex-direction:column;
  background:var(--bg); color:var(--fg);
  font:13px/1.45 system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input,textarea,button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

header{flex:0 0 auto;padding:12px 12px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:var(--sp)}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:650;letter-spacing:.01em}
.brand b{color:var(--accent);font-weight:650}
#count{color:var(--muted);font-size:11px}
.field{
  width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:6px;
  padding:5px 7px;font-size:12px;line-height:1.4;
}
.field:focus-visible{border-color:transparent}
#base{font-size:12px}

/* the only scroll region; min-height:0 lets it shrink inside the flex column */
#rows{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:var(--sp) 12px;scrollbar-width:thin}
.row{contain:layout style;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr) 24px;gap:6px;align-items:start;margin-bottom:6px}
.row .field{field-sizing:content;max-height:84px}   /* engine-side autosize, no JS measuring */
.row .k{font-weight:600}
/* raw mode: shown with its original percent-encoding, because decoding it
   could not be re-encoded losslessly. Marked, not hidden. */
.row .raw{border-style:dashed}
.del{background:none;border:0;color:var(--muted);cursor:pointer;border-radius:5px;padding:4px;line-height:1;transition:color .15s,background-color .15s}
.del:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:12px}

/* secondary area: collapsed by default, clearly labelled */
#alt{flex:0 0 auto;margin:0 12px var(--sp);border:1px solid var(--line);border-left:3px solid var(--info);border-radius:6px;background:var(--info-bg)}
#alt[data-kind="redirect"]{border-left-color:var(--warn);background:var(--warn-bg)}
#alt summary{cursor:pointer;padding:6px 8px;font-size:12px;display:flex;gap:6px;align-items:baseline;list-style:none}
#alt summary::-webkit-details-marker{display:none}
#alt summary::before{content:"▸";color:var(--muted);transition:transform .15s;display:inline-block}
#alt[open] summary::before{transform:rotate(90deg)}
#alt-kind{font-weight:650;color:var(--info)}
#alt[data-kind="redirect"] #alt-kind{color:var(--warn)}
#alt-sum{color:var(--muted)}
.alt-body{padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}
#alt-url{resize:none;field-sizing:content;max-height:96px;word-break:break-all}
.alt-btns{display:flex;gap:6px;justify-content:flex-end}

#note{flex:0 0 auto;margin:0 12px var(--sp);padding:6px 8px;border-radius:6px;font-size:12px;background:var(--warn-bg);color:var(--warn)}

footer{flex:0 0 auto;padding:10px 12px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:var(--sp)}
#preview{font-size:11px;line-height:1.4;color:var(--muted);max-height:46px;overflow-y:auto;word-break:break-all}
.changed #preview{color:var(--fg)}
.btns{display:flex;gap:var(--sp)}
.btn{border-radius:var(--r);padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:none;transition:background-color .15s,transform .15s}
.btn:hover{background:var(--field)}
.btn:active{transform:translateY(1px)}
.btn.primary{flex:1;background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:650}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.primary:disabled,.btn:disabled{opacity:.5;cursor:default}
.unreadable #base{opacity:.5}
.btn.small{padding:4px 10px;font-size:12px}
.hint{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint.pin{color:var(--accent)}
.changed .hint .dot{color:var(--accent)}
</style>
</head>
<body>
<header>
  <div class="top">
    <span class="brand">URL <b>Scissors</b></span>
    <span id="count"></span>
  </div>
  <input id="base" class="field mono" spellcheck="false" autocomplete="off" aria-label="網址（origin + path）">
</header>

<div id="rows" role="list" aria-label="query 參數"></div>

<details id="alt" hidden>
  <summary><span id="alt-kind"></span><span id="alt-sum"></span></summary>
  <div class="alt-body">
    <textarea id="alt-url" class="field mono" spellcheck="false" rows="1" aria-label="次要網址"></textarea>
    <div class="alt-btns">
      <button class="btn small" id="alt-dismiss" type="button">捨棄</button>
      <button class="btn small primary" id="alt-apply" type="button">套用這個網址</button>
    </div>
  </div>
</details>

<div id="note" role="status" hidden></div>

<footer>
  <div id="preview" class="mono" aria-live="polite"></div>
  <div class="btns">
    <button class="btn primary" id="apply" type="button">套用</button>
    <button class="btn" id="add" type="button">+ 參數</button>
  </div>
  <div class="hint" id="hint"><span class="dot">●</span> Enter 套用 · 套用後視窗保持開啟 · Esc 關閉</div>
</footer>

<template id="row-tpl">
  <div class="row" role="listitem"><input class="field mono k" spellcheck="false" autocomplete="off" placeholder="key" aria-label="key"><input class="field mono v" spellcheck="false" autocomplete="off" placeholder="value" aria-label="value"><button class="del" type="button" title="刪除這個參數" aria-label="刪除">✕</button></div>
</template>

<script src="popup.js"></script>
</body>
</html>
