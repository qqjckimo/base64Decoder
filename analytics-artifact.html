<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CF Workers Analytics Artifact</title>
    <style>
      :root {
        --bg: #0f1419;
        --panel: #1a2230;
        --border: #2a3548;
        --text: #e6e8eb;
        --muted: #8a96a8;
        --accent: #4a90e2;
        --error: #e85a4a;
        --success: #5ab97f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 22px;
        font-weight: 600;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px 16px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field label {
        font-size: 12px;
        color: var(--muted);
      }
      .field input {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text);
        padding: 8px 10px;
        font: inherit;
        font-size: 14px;
      }
      .field input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .actions {
        margin-top: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      button {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 9px 16px;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.1);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        font-size: 13px;
        color: var(--muted);
      }
      .status.error {
        color: var(--error);
      }
      .status.success {
        color: var(--success);
      }
      .chart-wrap {
        position: relative;
        min-height: 320px;
      }
      .legend {
        display: flex;
        gap: 16px;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .legend .swatch {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 2px;
        margin-right: 6px;
        vertical-align: middle;
      }
      svg.chart {
        display: block;
        width: 100%;
        height: auto;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
      }
      .no-data {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 320px;
        color: var(--muted);
        background: var(--bg);
        border: 1px dashed var(--border);
        border-radius: 4px;
      }
      .axis-label,
      .tick-label {
        fill: var(--muted);
        font-size: 11px;
        font-family: inherit;
      }
      .axis-line {
        stroke: var(--border);
        stroke-width: 1;
      }
      .gridline {
        stroke: var(--border);
        stroke-width: 1;
        stroke-dasharray: 2 3;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Cloudflare Workers Analytics</h1>

      <form id="query-form" class="panel" autocomplete="off">
        <div class="form-grid">
          <div class="field">
            <label for="proxy-url">Proxy URL</label>
            <input
              type="text"
              id="proxy-url"
              name="proxyUrl"
              placeholder="https://tools.example.workers.dev/cf-analytics-proxy"
              required
            />
          </div>
          <div class="field">
            <label for="proxy-key">Proxy Key</label>
            <input
              type="password"
              id="proxy-key"
              name="proxyKey"
              placeholder="X-Proxy-Key value"
              required
            />
          </div>
          <div class="field">
            <label for="script-name">Script Name</label>
            <input
              type="text"
              id="script-name"
              name="scriptName"
              placeholder="tools"
              required
            />
          </div>
          <div class="field">
            <label for="start-date">Start Date</label>
            <input type="date" id="start-date" name="startDate" required />
          </div>
          <div class="field">
            <label for="end-date">End Date</label>
            <input type="date" id="end-date" name="endDate" required />
          </div>
        </div>
        <div class="actions">
          <button type="submit" id="submit-btn">Query</button>
          <span id="status" class="status"></span>
        </div>
      </form>

      <div class="panel">
        <div class="legend">
          <span><span class="swatch" style="background:var(--accent)"></span>Requests</span>
          <span><span class="swatch" style="background:var(--error)"></span>Errors</span>
        </div>
        <div id="chart-container" class="chart-wrap">
          <div class="no-data">No data — submit a query to load analytics.</div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const form = document.getElementById("query-form");
        const submitBtn = document.getElementById("submit-btn");
        const statusEl = document.getElementById("status");
        const chartContainer = document.getElementById("chart-container");

        const today = new Date();
        const lastWeek = new Date();
        lastWeek.setDate(today.getDate() - 7);
        document.getElementById("end-date").value = isoDate(today);
        document.getElementById("start-date").value = isoDate(lastWeek);

        function isoDate(d) {
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const day = String(d.getDate()).padStart(2, "0");
          return `${y}-${m}-${day}`;
        }

        function setStatus(text, kind) {
          statusEl.textContent = text || "";
          statusEl.className = "status" + (kind ? " " + kind : "");
        }

        function buildGraphQLBody({ scriptName, startDate, endDate }) {
          const query = `query Viewer($scriptName: String!, $start: Time, $end: Time) {
  viewer {
    accounts {
      workersInvocationsAdaptive(
        limit: 10000
        filter: {
          scriptName: $scriptName
          datetime_geq: $start
          datetime_leq: $end
        }
        orderBy: [datetimeHour_ASC]
      ) {
        sum {
          requests
          errors
        }
        dimensions {
          datetimeHour
        }
      }
    }
  }
}`;
          // GraphQL Time scalars expect ISO 8601 with timezone
          const startIso = new Date(startDate + "T00:00:00Z").toISOString();
          const endIso = new Date(endDate + "T23:59:59Z").toISOString();
          return {
            query,
            variables: {
              scriptName,
              start: startIso,
              end: endIso,
            },
          };
        }

        function showEmptyState(msg) {
          chartContainer.innerHTML = "";
          const div = document.createElement("div");
          div.className = "no-data";
          div.textContent = msg;
          chartContainer.appendChild(div);
        }

        function extractSeries(payload) {
          const accounts =
            payload &&
            payload.data &&
            payload.data.viewer &&
            payload.data.viewer.accounts;
          if (!Array.isArray(accounts) || accounts.length === 0) return [];

          const points = [];
          for (const acct of accounts) {
            const rows = acct.workersInvocationsAdaptive || [];
            for (const row of rows) {
              const dims = row.dimensions;
              const dt = dims && (dims.datetimeHour || dims.datetime);
              const requests = (row.sum && row.sum.requests) || 0;
              const errors = (row.sum && row.sum.errors) || 0;
              if (dt) {
                points.push({
                  datetime: new Date(dt),
                  requests,
                  errors,
                });
              }
            }
          }
          points.sort((a, b) => a.datetime - b.datetime);
          return points;
        }

        function renderChart(points) {
          if (!points || points.length === 0) {
            showEmptyState("No data for selected range.");
            return;
          }

          chartContainer.innerHTML = "";

          const W = 1000;
          const H = 360;
          const PAD_L = 60;
          const PAD_R = 24;
          const PAD_T = 16;
          const PAD_B = 48;
          const innerW = W - PAD_L - PAD_R;
          const innerH = H - PAD_T - PAD_B;

          let xMin = Infinity, xMax = -Infinity, yMax = 0;
          for (const p of points) {
            const t = p.datetime.getTime();
            if (t < xMin) xMin = t;
            if (t > xMax) xMax = t;
            const peak = Math.max(p.requests, p.errors);
            if (peak > yMax) yMax = peak;
          }
          yMax = Math.max(1, yMax);
          const xRange = xMax - xMin || 1;

          const x = (t) => PAD_L + ((t - xMin) / xRange) * innerW;
          const y = (v) => PAD_T + innerH - (v / yMax) * innerH;

          const SVG_NS = "http://www.w3.org/2000/svg";
          const svg = document.createElementNS(SVG_NS, "svg");
          svg.setAttribute("class", "chart");
          svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
          svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

          const yTicks = 5;
          for (let i = 0; i <= yTicks; i++) {
            const v = (yMax / yTicks) * i;
            const yy = y(v);
            const line = document.createElementNS(SVG_NS, "line");
            line.setAttribute("class", "gridline");
            line.setAttribute("x1", PAD_L);
            line.setAttribute("x2", PAD_L + innerW);
            line.setAttribute("y1", yy);
            line.setAttribute("y2", yy);
            svg.appendChild(line);

            const label = document.createElementNS(SVG_NS, "text");
            label.setAttribute("class", "tick-label");
            label.setAttribute("x", PAD_L - 8);
            label.setAttribute("y", yy + 4);
            label.setAttribute("text-anchor", "end");
            label.textContent = formatNumber(v);
            svg.appendChild(label);
          }

          const xAxis = document.createElementNS(SVG_NS, "line");
          xAxis.setAttribute("class", "axis-line");
          xAxis.setAttribute("x1", PAD_L);
          xAxis.setAttribute("x2", PAD_L + innerW);
          xAxis.setAttribute("y1", PAD_T + innerH);
          xAxis.setAttribute("y2", PAD_T + innerH);
          svg.appendChild(xAxis);

          const yAxis = document.createElementNS(SVG_NS, "line");
          yAxis.setAttribute("class", "axis-line");
          yAxis.setAttribute("x1", PAD_L);
          yAxis.setAttribute("x2", PAD_L);
          yAxis.setAttribute("y1", PAD_T);
          yAxis.setAttribute("y2", PAD_T + innerH);
          svg.appendChild(yAxis);

          const xTickCount = Math.min(6, points.length);
          for (let i = 0; i < xTickCount; i++) {
            const idx =
              xTickCount === 1
                ? 0
                : Math.round((i * (points.length - 1)) / (xTickCount - 1));
            const t = points[idx].datetime;
            const xx = x(t.getTime());
            const label = document.createElementNS(SVG_NS, "text");
            label.setAttribute("class", "tick-label");
            label.setAttribute("x", xx);
            label.setAttribute("y", PAD_T + innerH + 16);
            label.setAttribute("text-anchor", "middle");
            label.textContent = formatTime(t);
            svg.appendChild(label);
          }

          const yTitle = document.createElementNS(SVG_NS, "text");
          yTitle.setAttribute("class", "axis-label");
          yTitle.setAttribute("x", 14);
          yTitle.setAttribute("y", PAD_T + innerH / 2);
          yTitle.setAttribute(
            "transform",
            `rotate(-90 14 ${PAD_T + innerH / 2})`
          );
          yTitle.setAttribute("text-anchor", "middle");
          yTitle.textContent = "Count";
          svg.appendChild(yTitle);

          const xTitle = document.createElementNS(SVG_NS, "text");
          xTitle.setAttribute("class", "axis-label");
          xTitle.setAttribute("x", PAD_L + innerW / 2);
          xTitle.setAttribute("y", H - 8);
          xTitle.setAttribute("text-anchor", "middle");
          xTitle.textContent = "Time";
          svg.appendChild(xTitle);

          const requestsPoints = points
            .map((p) => `${x(p.datetime.getTime())},${y(p.requests)}`)
            .join(" ");
          const errorsPoints = points
            .map((p) => `${x(p.datetime.getTime())},${y(p.errors)}`)
            .join(" ");

          const reqLine = document.createElementNS(SVG_NS, "polyline");
          reqLine.setAttribute("fill", "none");
          reqLine.setAttribute("stroke", "#4a90e2");
          reqLine.setAttribute("stroke-width", "2");
          reqLine.setAttribute("points", requestsPoints);
          svg.appendChild(reqLine);

          const errLine = document.createElementNS(SVG_NS, "polyline");
          errLine.setAttribute("fill", "none");
          errLine.setAttribute("stroke", "#e85a4a");
          errLine.setAttribute("stroke-width", "2");
          errLine.setAttribute("points", errorsPoints);
          svg.appendChild(errLine);

          chartContainer.appendChild(svg);
        }

        function formatNumber(v) {
          if (v >= 1_000_000) return (v / 1_000_000).toFixed(1) + "M";
          if (v >= 1000) return (v / 1000).toFixed(1) + "k";
          return String(Math.round(v));
        }

        function formatTime(d) {
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const day = String(d.getDate()).padStart(2, "0");
          const hr = String(d.getHours()).padStart(2, "0");
          return `${m}-${day} ${hr}:00`;
        }

        async function submitQuery(formData) {
          const body = buildGraphQLBody(formData);
          let res;
          try {
            res = await fetch(formData.proxyUrl, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-Proxy-Key": formData.proxyKey,
              },
              body: JSON.stringify(body),
            });
          } catch (err) {
            throw new Error("Network error: " + err.message);
          }

          if (res.status === 401) {
            throw new Error("Invalid Proxy Key (HTTP 401).");
          }
          if (!res.ok) {
            let detail = "";
            try {
              detail = await res.text();
            } catch (_) {}
            throw new Error(
              `Proxy returned HTTP ${res.status}. ${detail.slice(0, 200)}`
            );
          }

          let payload;
          try {
            payload = await res.json();
          } catch (err) {
            throw new Error("Failed to parse JSON response: " + err.message);
          }

          if (payload.errors && payload.errors.length) {
            throw new Error(
              "GraphQL error: " + payload.errors.map((e) => e.message).join("; ")
            );
          }
          return extractSeries(payload);
        }

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const formData = {
            proxyUrl: document.getElementById("proxy-url").value.trim(),
            proxyKey: document.getElementById("proxy-key").value,
            scriptName: document.getElementById("script-name").value.trim(),
            startDate: document.getElementById("start-date").value,
            endDate: document.getElementById("end-date").value,
          };

          submitBtn.disabled = true;
          setStatus("Loading...", "");

          try {
            const points = await submitQuery(formData);
            renderChart(points);
            setStatus(`Loaded ${points.length} data point(s).`, "success");
          } catch (err) {
            setStatus(err.message, "error");
            showEmptyState("No data — see error above.");
          } finally {
            submitBtn.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
